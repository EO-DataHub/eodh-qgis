[project]
name = "eodh-qgis"
version = "0.0.2"
description = "Search, filter, preview, and load datasets from the UK EO Data Hub"
authors = [{ name = "Dusan Figala", email = "dusan@oxidian.com" }]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = ["truststore>=0.10.4; python_version >= '3.10'"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pre-commit",
    "pyright",
    "ruff",
    "validate-pyproject",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "-ra"]

[tool.pyright]
include = ["eodh_qgis"]
pythonVersion = "3.9"
typeCheckingMode = "basic"
reportMissingImports = "warning"

[tool.ruff]
line-length = 119
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "FAST", # FastAPI
    "RUF",  # RUF-specific rules
    "SIM",  # Simplifications
    "B",    # Bugbear
    "ANN",  # Annotations
    "PLC",  # Pylint convention
    "PLE",  # Pylint errors
    "UP",   # pyupgrade
    "FURB", # refurb
    "PT",   # pytest
]
ignore = [
    "E501",    # line too long
    "SIM108",  # ternary operator
    "SIM103",  # return bool directly
    "SIM105",  # suppressible exception
    "SIM115",  # open-file-with-context-handler
    "B008",    # function call in default argument (incompatible with FastAPI)
    "B023",    # function uses loop variable - intentional closures in Qt signal handlers
    "ANN",     # missing type annotations - too many to add at once
    "PLC0415", # import outside top-level - intentional lazy imports in QGIS plugin
    "RUF012",  # mutable class default - used in Qt classes
    "RUF059",  # unused unpacked variable
    "UP031",   # printf-string-formatting
    "FURB162", # fromisoformat-replace-z
]
