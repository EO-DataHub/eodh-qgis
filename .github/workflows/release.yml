name: Release
on:
  push:
    tags:
      - "**"
      - "!nightly"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set plugin version from tag
        run: sed -i "s/^version=.*/version=${{ github.ref_name }}/" metadata.txt

      - name: Build release
        run: |
          python deploy.py --dist dist/eodh_qgis
          cd dist
          zip -r eodh_qgis_${{ github.ref_name }}.zip eodh_qgis

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/eodh_qgis_${RELEASE_TAG}.zip" --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" "dist/eodh_qgis_${RELEASE_TAG}.zip" --title "$RELEASE_TAG" --verify-tag
          fi
